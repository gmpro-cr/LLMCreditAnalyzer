name: keep-warm

# Pings both Render free-tier services so they don't sleep after ~15 min idle
# (the first request after sleep otherwise returns a 503 during cold start).
# GitHub's scheduler can lag a few minutes under load — fine for a demo.
#
# It also pings the database, which is a different problem with a different
# clock: Supabase pauses an idle free-tier project after ~7 days and withdraws
# its DNS record, which is what took the app down on 2026-08-03. Keeping the
# API warm never touched the database, so it kept idling. GitHub throttles this
# cron to hours in practice — irrelevant against a 7-day window.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API server
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 90 \
            https://creditguard-api.onrender.com/api/healthz
      - name: Ping Python engine
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 90 \
            https://creditguard-python.onrender.com/health

      # Real Supabase activity, so the project's idle timer keeps resetting.
      # `-f` is deliberate: if the database is unreachable this step fails and
      # the workflow goes red, which is the alert we did not have last time.
      - name: Ping database (keeps Supabase off the free-tier pause timer)
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 90 \
            https://creditguard-api.onrender.com/api/db-health
